model_type: "fastwam"
model_path: ${oc.env:FASTWAM_MODEL_PATH}
dataset_stats_path: ${oc.env:FASTWAM_DATASET_STATS_PATH}
model_id: "Wan-AI/Wan2.2-TI2V-5B"
tokenizer_model_id: "Wan-AI/Wan2.1-T2V-1.3B"
tokenizer_max_len: 128
load_text_encoder: true
redirect_common_files: true
mot_checkpoint_mixed_attn: true
skip_dit_load_from_pretrain: false
action_dit_pretrained_path: ${oc.env:FASTWAM_ACTION_DIT_PATH}

action_dim: 7
num_action_chunks: 10
action_horizon: 32
proprio_dim: 8
precision: bf16
is_lora: false

video_size: [224, 448]
concat_multi_camera: "horizontal"
binarize_gripper: true
num_inference_steps: 20
sigma_shift: null
text_cfg_scale: 1.0
negative_prompt: ""
rand_device: "cpu"
tiled: false

processor:
  _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
      - key: wrist_image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 7
        shape: 7
    state:
      - key: default
        raw_shape: 8
        shape: 8
  num_obs_steps: 33
  num_output_cameras: 2
  action_output_dim: 7
  proprio_output_dim: 8
  action_state_transforms: null
  use_stepwise_action_norm: false
  norm_default_mode: min/max
  norm_exception_mode: null
  action_state_merger:
    _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
  train_transforms: null
  val_transforms: null
  delta_action_dim_mask:
    default: [true, true, true, true, true, true, false]

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: true
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: 7
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: 7
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: true

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0
