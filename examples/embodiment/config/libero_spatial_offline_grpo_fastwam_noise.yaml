defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/fastwam@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_offline_grpo_fastwam_noise"
    logger_backends: ["tensorboard"]

  max_epochs: 4000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 200

  resume_dir: null
  ckpt_path: null

data:
  train_data_paths: "/mnt/project_rlinf/jzn/workspace/openpi/data/libero_spatial_fullshot"
  prompt_batch_size_per_gpu: 1
  action_chunk: ${actor.model.num_action_chunks}
  shuffle: True
  seed: 42
  num_workers: 4
  image_key: "image"
  wrist_image_key: "wrist_image"
  state_key: "state"
  action_key: "actions"
  task_index_key: "task_index"
  frame_index_key: "frame_index"
  max_cache_episodes: 4

algorithm:
  normalize_advantages: True
  group_size: 4
  rollout_epoch: 1
  eval_rollout_epoch: 0

  reward_type: chunk_level
  offline_reward_fn: l1
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

env:
  group_name: "EnvGroup"

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 4
  seed: 42
  enable_offload: False

  model:
    num_inference_steps: 20
    num_action_chunks: 10
    action_horizon: 32

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
